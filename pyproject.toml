[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meyelens"
version = "2.0.2"
description = "PyTorch pupillometry, eye segmentation, recording, and gaze tracking"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE-SOFTWARE", "LICENSE-HARDWARE"]
authors = [
  { name = "Raffaele Mazziotti", email = "mzzrff@gmail.com" },
  { name = "Giacomo Vecchieschi", email = "giacomovecchieschi@gmail.com" },
]
keywords = [
  "pupillometry",
  "eye tracking",
  "gaze tracking",
  "computer vision",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]
# Install a platform-appropriate PyTorch 2.2+ build separately.
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.4.6",
  "opencv-python==4.13.0.92",
  "pandas==3.0.3",
  "PyQt6==6.11.0",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
  "toml==0.10.2",
  "transformers==5.8.1",
]

[project.optional-dependencies]
pt = ["torch==2.12.0"]
efficientformer = ["timm>=1.0"]
experiments = ["psychopy>=2024.1"]
docs = [
  "myst-parser>=2",
  "sphinx>=7",
  "sphinx-copybutton>=0.5",
  "sphinx-rtd-theme>=2",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

[project.urls]
Homepage = "https://www.meyelens.com"
Repository = "https://github.com/raffaelemazziotti/MEYElens"
Documentation = "https://raffaelemazziotti.github.io/MEYElens/"
Issues = "https://github.com/raffaelemazziotti/MEYElens/issues"

[project.scripts]
meyelens-gui = "meyelens.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meyelens*"]

[tool.setuptools.package-data]
"meyelens.models" = ["meye_default.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
